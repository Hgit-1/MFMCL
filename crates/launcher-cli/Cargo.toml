[package]
name = "mfmcl-cli"
version.workspace = true
edition.workspace = true
description = "Command-line frontend for MFMCL"

# The logic lives in a library so the desktop binary can serve `mfmcl cli …` on
# platforms where one executable can be both a GUI and a terminal program.
[lib]
name = "launcher_cli"
path = "src/lib.rs"

# Named `mfmcl-cli`, not `mfmcl`: the GUI binary takes the `mfmcl` name on every
# platform (see `mainBinaryName` in `src-tauri/tauri.conf.json`). On Linux and
# macOS this standalone binary is not shipped at all — the desktop binary answers
# `mfmcl cli …` instead — but it stays buildable for anyone who wants a pure CLI.
[[bin]]
name = "mfmcl-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
chrono.workspace = true
download-engine = { path = "../download-engine" }
launcher-core = { path = "../launcher-core" }
launcher-runtime = { path = "../launcher-runtime" }
mc-metadata = { path = "../mc-metadata" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# Only for `SetConsoleOutputCP`: keeping Chinese output readable on a console whose
# default code page is 936. See `src/console.rs`.
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
