[package]
name = "launcher-runtime"
version.workspace = true
edition.workspace = true
description = "Frontend-agnostic launch, install, and backup orchestration"

[dependencies]
chrono.workspace = true
download-engine = { path = "../download-engine" }
launcher-auth = { path = "../launcher-auth", features = ["native-credentials"] }
launcher-core = { path = "../launcher-core" }
mc-metadata = { path = "../mc-metadata" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
