[package]
name = "launcher-auth"
version = "0.1.0"
edition = "2024"
description = "Bounded backend-only Minecraft authentication"
license = "MIT"


[features]
default = []
native-credentials = ["dep:keyring"]

[dependencies]
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
