<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>崩溃分析 · MFMC Launcher</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!--
  Standalone analysis page.

  Deliberately not part of the launcher shell: this is the surface to iterate on
  the analysis presentation, so it carries no sidebar, no theme system and no
  instance context. Everything here is about one log and one answer.
-->
<div class="shell">

  <header class="head">
    <div class="head-main">
      <h1>崩溃分析</h1>
      <p class="sub">把崩溃日志贴进来，先用确定性规则判断原因，再由本地 LFM3-1.7B 模型解释。</p>
    </div>
    <div class="status" id="status" data-state="checking">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">正在检查模型…</span>
    </div>
  </header>

  <main class="grid">

    <!-- 输入 -->
    <section class="card input-card">
      <div class="card-head">
        <h2>日志</h2>
        <div class="card-actions">
          <label class="file-btn">
            <input type="file" id="file" accept=".log,.txt,text/plain" hidden />
            选择文件
          </label>
          <button type="button" class="ghost" id="load-sample">示例日志</button>
          <button type="button" class="ghost" id="clear">清空</button>
        </div>
      </div>

      <!-- 拖放区直接包住 textarea，整个输入框都是投放目标 -->
      <div class="drop" id="drop">
        <textarea id="log" spellcheck="false" placeholder="粘贴 latest.log 或 crash-report 的内容，也可以把文件拖到这里。&#10;&#10;日志不会被上传到任何服务器：分析在本机完成。"></textarea>
        <div class="drop-hint" id="drop-hint" hidden>松开以读取文件</div>
      </div>

      <div class="meta-row">
        <span id="log-meta" class="meta">尚未载入日志</span>
        <label class="toggle">
          <input type="checkbox" id="use-model" checked />
          <span>使用模型解释</span>
        </label>
      </div>

      <details class="env">
        <summary>环境信息（可选，能显著提高准确度）</summary>
        <div class="env-grid">
          <label>游戏版本 <input id="env-game" placeholder="1.21.1" /></label>
          <label>Java 版本 <input id="env-java" placeholder="21.0.2" /></label>
          <label>加载器 <input id="env-loader" placeholder="Fabric" /></label>
          <label>分配内存 (MB) <input id="env-memory" type="number" min="512" step="512" placeholder="4096" /></label>
        </div>
      </details>

      <div class="submit-row">
        <button type="button" class="primary" id="analyse">开始分析</button>
        <span class="hint" id="analyse-hint">规则分析是即时的；开启模型后需要几秒到一分钟</span>
      </div>
    </section>

    <!-- 结果 -->
    <section class="card result-card" id="result-card">
      <div class="card-head">
        <h2>分析结果</h2>
        <span class="meta" id="result-meta"></span>
      </div>
      <div id="result" class="result empty">
        <p class="placeholder">还没有分析结果。</p>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span>规则部分在本地匹配崩溃特征；模型部分是补充解释，不是独立结论。</span>
    <span id="foot-model" class="meta"></span>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
