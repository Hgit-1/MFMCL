name: Release artifacts (macOS + Linux)

# Builds the two platforms that cannot be produced locally here and attaches the
# results to an existing GitHub Release.
#
# ## Why this is separate from `desktop-artifacts.yml`
#
# That workflow exists to prove the desktop backend compiles on all three runners.
# It uploads throwaway artifacts and is deliberately NOT a publication path.
#
# This one publishes, so it is a different contract: it has `contents: write`, it
# targets one release tag, and it is only run when someone asks for a release.
# Merging the two would mean every routine compile check holds write access to
# releases.
#
# ## Why macOS is built as one universal bundle
#
# Without signing there is no reason to ship two DMGs that differ only in
# architecture. `universal-apple-darwin` produces one bundle that runs on both
# Intel and Apple Silicon, which is also the smaller thing to document and to
# checksum. The cost is compiling twice, which on a runner is a few minutes.
#
# ## Why Linux uses ubuntu-22.04
#
# Not a stylistic choice. A binary built against a newer glibc refuses to start on
# an older system, so building on 24.04 would make the .deb unusable on the
# distributions that most need a .deb. 22.04 is the oldest runner Tauri still
# supports, which maximises the set of machines that can run the result.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach artifacts to'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  # Any `tauri build` invocation must be reproducible from the log alone, so the
  # version is read from the manifest rather than typed.
  RUST_BACKTRACE: '1'

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/flowlaunch-ui/package-lock.json

      # Tauri's Linux prerequisites.
      #
      # `libfuse2` is not enough on its own for AppImage: `linuxdeploy` is itself
      # an AppImage and tries to FUSE-mount itself, which GitHub runners do not
      # allow. The `APPIMAGE_EXTRACT_AND_RUN` env var (set on the build step)
      # makes it extract to a temp dir instead. Without both, the AppImage leg
      # either fails with "failed to run linuxdeploy" or hangs for 20+ minutes.
      #
      # `patchelf` is what the AppImage bundler uses to rewrite the interpreter
      # and rpath of the collected binaries.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libfuse2

      - run: npm ci --prefix design/flowlaunch-ui
      - run: npm run build --prefix design/flowlaunch-ui
      - run: npm install --global @tauri-apps/cli@^2

      # `--no-sign` is honest: there is no Linux signing step in this project, and
      # asking for one would make the build fail rather than produce an unsigned
      # artifact.
      #
      # ubuntu-22.04 is chosen, not 24.04: a binary linked against a newer glibc
      # refuses to start on an older system, and the distributions that most need
      # a .deb are the older ones.
      - name: Build bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --no-sign --bundles deb,rpm,appimage

      - name: Build CLI
        run: cargo build --release -p mfmcl-cli

      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/ || true
          cp target/release/bundle/rpm/*.rpm dist/ || true
          cp target/release/bundle/appimage/*.AppImage dist/ || true
          cp target/release/mfmcl-cli dist/mfmcl-cli
          cd dist
          sha256sum * > SHA256SUMS-linux.txt
          ls -la

      # A package with no License header is not neutral — `rpm -qi` reports
      # "Unspecified", which is exactly the field a distribution user checks
      # before installing. Publishing it silently would be worse than failing the
      # build, so the absence is reported in the job summary where whoever
      # triggers the workflow will see it.
      - name: Note the missing licence
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          > **Note:** this project has no `LICENSE` file and no `license` field in
          > `Cargo.toml`, so the `.rpm` reports `License: Unspecified` and the
          > `.deb` has no `License` field at all. That is not acceptable for a
          > package a distribution might carry. It is recorded here rather than
          > fixed silently because the choice of licence is the author's.
          NOTE

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices are needed before Tauri can lipo them together.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/flowlaunch-ui/package-lock.json

      - run: npm ci --prefix design/flowlaunch-ui
      - run: npm run build --prefix design/flowlaunch-ui
      - run: npm install --global @tauri-apps/cli@^2

      - name: Build universal bundle
        run: npm run tauri -- build --ci --no-sign --target universal-apple-darwin --bundles app,dmg

      # The CLI is a separate binary and Tauri does not build it, so the two slices
      # have to be produced and merged by hand. `lipo` is what Tauri itself uses
      # for the app bundle.
      - name: Build universal CLI
        run: |
          cargo build --release -p mfmcl-cli --target aarch64-apple-darwin
          cargo build --release -p mfmcl-cli --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/mfmcl-cli \
            target/x86_64-apple-darwin/release/mfmcl-cli \
            -output dist/mfmcl-cli

      - name: Collect
        run: |
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/ || true
          cd dist
          shasum -a 256 * > SHA256SUMS-macos.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Renaming happens here rather than in each build job so the two platforms
      # cannot drift into different naming schemes.
      #
      # Every name carries the platform because the release holds four operating
      # systems' worth of files in one flat list; a bare `MFMCL_0.1.0.AppImage`
      # next to `MFMCL_0.1.0.dmg` gives a downloader no clue which one will run.
      - name: Normalise file names
        run: |
          set -euo pipefail
          mkdir -p out
          tag="${{ github.event.inputs.tag }}"
          version="${tag#v}"

          for f in artifacts/release-linux/*.deb; do
            [ -e "$f" ] || continue
            cp "$f" "out/MFMCL_${version}_linux_amd64.deb"
          done
          for f in artifacts/release-linux/*.rpm; do
            [ -e "$f" ] || continue
            cp "$f" "out/MFMCL_${version}_linux_x86_64.rpm"
          done
          for f in artifacts/release-linux/*.AppImage; do
            [ -e "$f" ] || continue
            cp "$f" "out/MFMCL_${version}_linux_amd64.AppImage"
          done
          for f in artifacts/release-macos/*.dmg; do
            [ -e "$f" ] || continue
            cp "$f" "out/MFMCL_${version}_macos_universal.dmg"
          done

          cp artifacts/release-linux/mfmcl-cli "out/mfmcl-cli_${version}_linux_x64"
          cp artifacts/release-macos/mfmcl-cli "out/mfmcl-cli_${version}_macos_universal"

          chmod +x out/*.AppImage out/mfmcl-cli_* || true
          ls -la out

      # One checksum file per platform rather than a merged one: the Windows
      # assets were uploaded by hand from a local build, so a "complete" list
      # generated here would be a lie about what it covers.
      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum * > SHA256SUMS-macos-linux.txt
          cat SHA256SUMS-macos-linux.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.inputs.tag }}" out/* --clobber
