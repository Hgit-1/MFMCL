name: Release artifacts (Windows + macOS + Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a draft pre-release
        required: true
        default: v0.1.1

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: '1'
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Release ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            # Keep the oldest supported glibc baseline for release binaries.
            os: ubuntu-22.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/flowlaunch-ui/package-lock.json
      - name: Verify version and tag source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs check "$RELEASE_TAG"
          node --test scripts/release.test.mjs
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential curl wget file patchelf libfuse2 \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Use a canonical workspace-local fixture directory
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const root = fs.realpathSync(fs.mkdtempSync(path.join(process.cwd(), ".release-temp-")));
            fs.appendFileSync(process.env.GITHUB_ENV, ["TMPDIR", "TMP", "TEMP"].map(name => `${name}=${root}\n`).join(""));
          '
      - run: npm ci --prefix design/flowlaunch-ui
      - run: npm run typecheck --prefix design/flowlaunch-ui
      - run: npm run build --prefix design/flowlaunch-ui
      - run: node design/tools/aria-assets-regression.cjs
      - run: npm install --global @tauri-apps/cli@2.12.4
      - name: Build Windows bundles and CLI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --ci --no-sign --bundles nsis,msi -- --locked
          cargo build --release --locked -p mfmcl-cli
          target/release/mfmcl-cli.exe --version
      - name: Verify Windows executable version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $binary = Get-Item target/release/mfmcl.exe
          if ($binary.VersionInfo.FileVersion -ne $expected) {
            throw "Executable version does not match release tag."
          }
      - name: Build Linux bundles and CLI
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          npm run tauri -- build --ci --no-sign --bundles deb,rpm,appimage -- --locked
          cargo build --release --locked -p mfmcl-cli
          target/release/mfmcl-cli --version
      - name: Build macOS universal bundles and CLI
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          npm run tauri -- build --ci --no-sign --target universal-apple-darwin --bundles app,dmg -- --locked
          cargo build --release --locked -p mfmcl-cli --target aarch64-apple-darwin
          cargo build --release --locked -p mfmcl-cli --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/mfmcl-cli target/x86_64-apple-darwin/release/mfmcl-cli -output target/mfmcl-cli-universal
          lipo -verify_arch arm64 x86_64 target/mfmcl-cli-universal
          lipo -verify_arch arm64 x86_64 target/universal-apple-darwin/release/bundle/macos/MFMCL.app/Contents/MacOS/mfmcl
          target/mfmcl-cli-universal --version
      - name: Collect required artifacts
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release.mjs collect "$RELEASE_PLATFORM" "$RELEASE_TAG" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach verified artifacts to draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Verify complete asset set and calculate checksums
        run: node scripts/release.mjs checksums "$RELEASE_TAG" out
      - name: Upload only to the matching draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = true
          gh release upload "$RELEASE_TAG" out/* --clobber
      - name: Record release source
        run: |
          printf 'Draft artifacts built from %s (%s). Publication requires final asset verification.\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
