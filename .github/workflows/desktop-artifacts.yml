name: Unsigned desktop validation artifacts

# Manual test artifacts only. This is not a signed release or a publication workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            deps: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          # macos-14 正在按 GitHub 的退役计划下线（2026-11-02 停止），期间会对
          # 使用它的 job 触发 brownout：runner 不分配、job 在 2 秒内被取消，
          # 结论显示为失败。用 macos-15 替代——它同样提供 Xcode 工具链，且是
          # 当前受支持的镜像。不改 `runs-on` 的写法，只换镜像名，其余步骤通用。
          - os: macos-15
            deps: echo "Use the runner Xcode toolchain"
          - os: windows-2022
            deps: echo "Use the runner MSVC toolchain and WebView2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/flowlaunch-ui/package-lock.json
      - run: ${{ matrix.deps }}
        shell: bash
      - run: npm ci --prefix design/flowlaunch-ui
      - run: cargo test -p mc-metadata -p download-engine -p launcher-core -p launcher-auth
      - run: npm run build --prefix design/flowlaunch-ui
      - run: npm run tauri -- build --ci --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: mfmcl-unsigned-validation-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 7
