name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/flowlaunch-ui/package-lock.json
      - run: npm ci --prefix design/flowlaunch-ui
      - run: npm run typecheck --prefix design/flowlaunch-ui
      - run: npm run build --prefix design/flowlaunch-ui

  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test -p mc-metadata -p download-engine -p launcher-core -p launcher-auth
      - run: cargo check -p launcher-auth --features native-credentials

  desktop-compile:
    name: Compile desktop backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            deps: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          - os: macos-14
            deps: echo "Xcode command-line tools are preinstalled on the runner"
          - os: windows-2022
            deps: echo "MSVC and WebView2 are provided by the runner"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.deps }}
        shell: bash
      - run: npm ci --prefix design/flowlaunch-ui
      - run: cargo check -p mfmcl-desktop
