<a href="#account" aria-label="Lin  /  账户"><text fill="#202e29" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="15">Lin  /  账户</tspan></text><rect width="130" height="24" fill="transparent"/></a></g><g transform="translate(48 118)"><text fill="#202e29" font-size="30" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="32">登录你的 Minecraft 账户</tspan></text></g><g transform="translate(48 167)"><text fill="#67746d" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="16">使用微软官方授权页面，启动器不收集或保存你的微软密码。</tspan></text></g><g transform="translate(48 848)"><rect width="1344" height="1" rx="0" fill="#dfe5dc" stroke="none" stroke-width="0"/></g><g transform="translate(48 867)"><text fill="#67746d" font-size="11" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="13">原野 FIELD  /  Minecraft Java 版</tspan></text></g><g transform="translate(1090 867)"><text fill="#67746d" font-size="11" font-weight="400" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="302" y="13">设计原型 · 数据与状态仅作演示</tspan></text></g><g transform="translate(48 230)"><g transform="translate(0 0)"><rect width="762" height="510" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">安全地连接账户</tspan></text></g><g transform="translate(28 110)"><text fill="#202e29" font-size="20" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">1   在浏览器打开微软官方授权页</tspan><tspan x="0" y="52"></tspan><tspan x="0" y="82">2   完成登录与授权</tspan><tspan x="0" y="112"></tspan><tspan x="0" y="142">3   回到这里，检查 Java 版所有权</tspan></text></g><g transform="translate(28 414)"><a href="#auth-wait" aria-label="Button/primary/演示：前往外部授权"><g transform="translate(0 0)"><g transform="scale(2.75 1.0)"><g transform="translate(0 0)"><rect width="160" height="48" rx="12" fill="#286044" stroke="none" stroke-width="0"/></g></g></g><g transform="translate(18 14.0)"><g transform="translate(3.3333333333333335 10.0)"><polyline points="0.0,0.0 13.333333333333334,0.0" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(11.666666666666668 5.0)"><polyline points="0.0,0.0 5.0,5.0 0.0,10.0" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(48 11.0)"><text fill="#ffffff" font-size="15" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="17">演示：前往外部授权</tspan></text></g><rect width="440" height="48" fill="transparent"/></a></g></g><g transform="translate(842 230)"><g transform="translate(0 0)"><rect width="550" height="510" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">登录前，你应该知道</tspan></text></g><g transform="translate(28 94)"><text fill="#67746d" font-size="16" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="18">• 授权成功不等于拥有 Java 版。</tspan><tspan x="0" y="42"></tspan><tspan x="0" y="66">• 账户过期时会请你重新授权。</tspan><tspan x="0" y="90"></tspan><tspan x="0" y="114">• 无所有权、未成年限制和网络失败</tspan><tspan x="0" y="138">  都需要独立说明与下一步。</tspan><tspan x="0" y="162"></tspan><tspan x="0" y="186">• 离线仅用于已合法获取的本地内容，</tspan><tspan x="0" y="210">  不绕过游戏所有权或服务器认证。</tspan></text></g></g></svg>