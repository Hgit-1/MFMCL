" rx="1" fill="#655a3f" stroke="none" stroke-width="0"/></g><g transform="translate(191.1 175.35)"><polygon points="0.0,14.700000000000003 25.20000420000001,0.0 51.45000000000002,14.700000000000003 25.20000420000001,29.400000000000006" fill="#d5edad" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(191.1 190.05)"><polygon points="0.0,0.0 25.200000000000017,14.699985300000003 25.200000000000017,34.650000000000006 0.0,19.950014700000004" fill="#84ad73" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(216.3 190.05)"><polygon points="0.0,14.699985300000003 26.25,0.0 26.25,19.950014700000004 0.0,34.650000000000006" fill="#517b50" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(68 620)"><a href="#home" aria-label="Button/primary/进入设计原型"><g transform="translate(0 0)"><g transform="scale(1.2625 1.0)"><g transform="translate(0 0)"><rect width="160" height="48" rx="12" fill="#286044" stroke="none" stroke-width="0"/></g></g></g><g transform="translate(18 14.0)"><g transform="translate(3.3333333333333335 10.0)"><polyline points="0.0,0.0 13.333333333333334,0.0" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(11.666666666666668 5.0)"><polyline points="0.0,0.0 5.0,5.0 0.0,10.0" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(48 11.0)"><text fill="#ffffff" font-size="15" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="17">进入设计原型</tspan></text></g><rect width="202" height="48" fill="transparent"/></a></g><g transform="translate(68 782)"><text fill="#cedbc9" font-size="13" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="15">ORIGINAL DESIGN  /  2026.10</tspan><tspan x="0" y="35">独立视觉方案；并未审阅或复刻 PCL 界面。</tspan></text></g></svg></section><section id="guide" class="screen" data-title="01 / 使用说明与设计边界"><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="01 / 使用说明与设计边界"><rect width="1440" height="900" fill="#f5f5ef"/><g transform="translate(56 54)"><text fill="#286044" font-size="12" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="14">READ ME FIRST</tspan></text></g><g transform="translate(56 86)"><text fill="#202e29" font-size="32" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="34">这是一份设计稿，不是启动器程序。</tspan></text></g><g transform="translate(56 146)"><text fill="#67746d" font-size="15" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="17">所有页面由可编辑文字、矢量形状与可复用按钮构成。</tspan></text></g><g transform="translate(56 228)"><g transform="translate(0 0)"><rect width="640" height="160" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">01  直接修改</tspan></text></g><g transform="translate(24 62)"><text fill="#67746d" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="16">双击文字修改文案；调整形状颜色、尺寸和圆角。</tspan><tspan x="0" y="37">图层按页面、区块、控件分组。按钮表面使用共享 Symbol。</tspan></text></g></g><g transform="translate(722 228)"><g transform="translate(0 0)"><rect width="640" height="160" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">02  浏览流程</tspan></text></g><g transform="translate(24 62)"><text fill="#67746d" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="16">原生 Sketch 已记录主要按钮的画板跳转。</tspan><tspan x="0" y="37">离线 HTML 预览也可点击；不连接账户或下载游戏。</tspan></text></g></g><g transform="translate(56 412)"><g transform="translate(0 0)"><rect width="640" height="160" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">03  继续创作</tspan></text></g><g transform="translate(24 62)"><text fill="#67746d" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="16">附带完整 AI 提示词。品牌、颜色与导航均可推翻重做。</tspan><tspan x="0" y="37">提示词要求 Figma 原生组件、变量和 Auto Layout。</tspan></text></g></g><g transform="translate(722 412)"><g transform="translate(0 0)"><rect width="640" height="160" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">04  导入后检查</tspan></text></g><g transform="translate(24 62)"><text fill="#67746d" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="16">本文件经过格式结构验证，但不等于每个工具导入实测。</tspan><tspan x="0" y="37">字体、共享样式、Symbol 和原型连线需在目标工具复核。</tspan></text></g></g><g transform="translate(56 596)"><g transform="translate(0 0)"><rect width="640" height="160" rx="18" fill="#ffffff" stroke="#dfe5dc" stroke-width="1"/></g><g transform="translate(24 21)"><text fill="#202e29" font-size="20" font-weight="700" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><tspan x="0" y="22">05  功能边界</tspan></text></g><g transform
